apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: 679209311047.dkr.ecr.us-east-1.amazonaws.com/dl-org-hub/notification-service:latest
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_KAFKA_BOOTSTRAP-SERVERS
          valueFrom:
            configMapKeyRef:
              key: SPRING_KAFKA_BOOTSTRAP-SERVERS
              name: common-config
        - name: SPRING_KAFKA_CONSUMER_PROPERTIES_SCHEMA_REGISTRY_URL
          valueFrom:
            configMapKeyRef:
              key: SPRING_KAFKA_CONSUMER_PROPERTIES_SCHEMA_REGISTRY_URL
              name: notification-service-config
        - name: LOKI_URL
          valueFrom:
            configMapKeyRef:
              key: LOKI_URL
              name: common-config
        - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
          valueFrom:
            configMapKeyRef:
              key: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              name: common-config