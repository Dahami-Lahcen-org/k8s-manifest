apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: 679209311047.dkr.ecr.us-east-1.amazonaws.com/dl-org-hub/api-gateway:latest 
        ports:
        - containerPort: 9000
        env:
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI
        - name: LOKI_URL
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: LOKI_URL
        - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: PRODUCT_SERVICE_URL
        - name: ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: ORDER_SERVICE_URL
        - name: INVENTORY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: INVENTORY_SERVICE_URL