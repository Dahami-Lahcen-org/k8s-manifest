apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dl-org-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dahami-Lahcen-org/k8s-manifest.git
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true